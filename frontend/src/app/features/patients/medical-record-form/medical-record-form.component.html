<div class="card max-h-[90vh] w-full max-w-2xl overflow-y-auto p-5 md:p-7">
  <div class="mb-6 flex items-center justify-between border-b border-line pb-4">
    <h2>
      {{ record?.id ? "Editar Registro Médico" : "Nuevo Registro Médico" }}
    </h2>
    <button
      class="btn-text text-muted hover:text-danger"
      aria-label="Cerrar"
      (click)="cancel()"
    >
      ×
    </button>
  </div>

  <form [formGroup]="recordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label">Diagnóstico Principal</label>
      <textarea
        formControlName="diagnosis"
        class="input-field"
        rows="3"
        placeholder="Diagnóstico médico o psicológico..."
      ></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Medicación Actual</label>
      <textarea
        formControlName="currentMedication"
        class="input-field"
        rows="3"
        placeholder="Medicamentos..."
      ></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Plan de Tratamiento</label>
      <textarea
        formControlName="treatmentPlan"
        class="input-field"
        rows="4"
        placeholder="Estrategia u objetivos..."
      ></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Estado del Tratamiento</label>
      <select formControlName="treatmentStatus" class="input-field">
        <option value="Activo">Activo</option>
        <option value="Pausado">Pausado</option>
        <option value="Alta">Alta</option>
        <option value="Abandonado">Abandonado</option>
      </select>
    </div>

    @if (isDermatology) {
      <fieldset
        class="mb-5 mt-4 rounded-xl border border-line bg-clinic-50/50 p-4 md:p-5"
      >
        <div class="form-group">
          <label class="form-label">Tipo de Piel</label>
          <input
            type="text"
            formControlName="skinType"
            class="input-field"
            placeholder="Seca, grasa, mixta..."
          />
        </div>
        <div class="form-group">
          <label class="form-label">Alergias Conocidas</label>
          <textarea
            formControlName="knownAllergies"
            class="input-field"
            rows="2"
            placeholder="Medicamentos, tópicos..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Condiciones Crónicas</label>
          <textarea
            formControlName="chronicConditions"
            class="input-field"
            rows="2"
            placeholder="Rosácea, psoriasis..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Hábitos de Exposición Solar</label>
          <textarea
            formControlName="sunExposureHabits"
            class="input-field"
            rows="2"
            placeholder="Frecuencia, uso de protector..."
          ></textarea>
        </div>
      </fieldset>
    }

    <div
      class="mt-7 flex flex-col gap-3 border-t border-line pt-5 sm:flex-row sm:justify-end"
    >
      <button type="button" class="btn-secondary" (click)="cancel()">
        Cancelar
      </button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="recordForm.invalid || isSaving"
      >
        {{ record?.id ? "Guardar Cambios" : "Crear Registro" }}
      </button>
    </div>
  </form>
</div>
