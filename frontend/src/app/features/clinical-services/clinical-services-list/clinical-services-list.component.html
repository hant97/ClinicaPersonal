<section class="card">
  <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div><p class="text-sm text-muted">Catálogos</p><h2 class="text-xl font-semibold">Servicios clínicos</h2></div><button class="btn-primary min-h-11" (click)="openModal()"><lucide-icon [img]="Plus" [size]="18"></lucide-icon>Nuevo servicio</button></div>
  <div class="relative mb-6 max-w-2xl"><lucide-icon [img]="Search" [size]="20" class="input-leading-icon"></lucide-icon><input type="text" class="input-field input-with-leading-icon" placeholder="Buscar servicio por nombre..." (input)="onSearch($event)"></div>
  <div class="table-responsive"><table class="minimal-table min-w-[620px]"><thead><tr><th>Servicio</th><th>Descripción</th><th>Precio base</th><th><span class="sr-only">Acciones</span></th></tr></thead><tbody>
    @for (service of services; track service.id) { <tr><td><div class="flex items-center gap-3"><span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-clinic-100 text-clinic-700"><lucide-icon [img]="Activity" [size]="14"></lucide-icon></span><span class="font-medium">{{ service.name }}</span></div></td><td>{{ service.description || '-' }}</td><td class="font-semibold text-clinic-700">S/ {{ service.price | number:'1.2-2' }}</td><td><div class="flex gap-1"><button class="btn-text" (click)="openModal(service.id!)" title="Editar"><lucide-icon [img]="Edit" [size]="18"></lucide-icon></button><button class="inline-flex items-center justify-center rounded-lg p-2 text-danger hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-danger" (click)="deleteService(service.id!)" title="Eliminar"><lucide-icon [img]="Trash2" [size]="18"></lucide-icon></button></div></td></tr> }
    @empty { <tr><td colspan="4" class="py-12 text-center text-muted"><lucide-icon [img]="Activity" [size]="40" class="mx-auto mb-3 opacity-30"></lucide-icon>No hay servicios registrados.</td></tr> }
  </tbody></table>@if (totalPages > 1) { <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination> }</div>
</section>
@if (showModal) { <app-clinical-services-form [serviceId]="selectedServiceId" (closeModal)="closeModal($event)"></app-clinical-services-form> }
