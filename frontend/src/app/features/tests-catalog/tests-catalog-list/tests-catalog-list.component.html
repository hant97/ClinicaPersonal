<section class="card"><div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div><p class="text-sm text-muted">Catálogos</p><h2 class="text-xl font-semibold">Pruebas psicométricas</h2></div><button class="btn-primary min-h-11" (click)="createNewTest()">Crear nueva prueba</button></div><div class="table-responsive"><ng-container *ngIf="tests.length > 0; else noData"><table class="minimal-table min-w-[600px]"><thead><tr><th>Nombre de la prueba</th><th>Descripción</th><th><span class="sr-only">Acciones</span></th></tr></thead><tbody><tr *ngFor="let test of tests"><td class="font-medium">{{ test.name }}</td><td class="text-muted">{{ test.description }}</td><td><div class="flex gap-1"><button class="btn-text" (click)="editTest(test.id)" title="Editar"><lucide-icon [img]="Edit" [size]="18" [strokeWidth]="2"></lucide-icon></button><button class="inline-flex items-center justify-center rounded-lg p-2 text-danger hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-danger" (click)="deleteTest(test.id)" title="Eliminar"><lucide-icon [img]="Trash2" [size]="18" [strokeWidth]="2"></lucide-icon></button></div></td></tr></tbody></table><app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination></ng-container><ng-template #noData><div class="rounded-lg border border-dashed border-line bg-clinic-50/50 p-10 text-center text-muted">No hay pruebas registradas en el catálogo.</div></ng-template></div></section>
