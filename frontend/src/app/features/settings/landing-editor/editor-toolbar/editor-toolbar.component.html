<header class="toolbar">
  <div class="toolbar-group">
    <button type="button" class="toolbar-button" aria-label="Salir del editor" (click)="exit.emit()"><lucide-icon [img]="X" [size]="18" /></button>
    <span class="toolbar-title">Editar sitio</span>
    <span class="status-badge" [class.status-dirty]="dirty" [class.status-busy]="busy">
      @if (saving || publishing) { <span class="spinner spinner-sm"></span> }
      {{ statusLabel }}
    </span>
  </div>

  <div class="toolbar-group toolbar-center">
    <div class="viewport-switch" role="group" aria-label="Tamaño de previsualización">
      <button type="button" class="viewport-button" [class.active]="viewport === 'desktop'" aria-label="Escritorio" (click)="setViewport('desktop')"><lucide-icon [img]="Monitor" [size]="16" /></button>
      <button type="button" class="viewport-button" [class.active]="viewport === 'tablet'" aria-label="Tableta" (click)="setViewport('tablet')"><lucide-icon [img]="Tablet" [size]="16" /></button>
      <button type="button" class="viewport-button" [class.active]="viewport === 'mobile'" aria-label="Móvil" (click)="setViewport('mobile')"><lucide-icon [img]="Smartphone" [size]="16" /></button>
    </div>
  </div>

  <div class="toolbar-group toolbar-actions">
    <button type="button" class="toolbar-button toolbar-button-label" (click)="openPublic.emit()"><lucide-icon [img]="Eye" [size]="16" /> Vista pública</button>
    <button type="button" class="toolbar-button toolbar-button-label" title="Restaurar borrador desde la versión publicada" (click)="reset.emit()"><lucide-icon [img]="RotateCcw" [size]="16" /> Restaurar</button>
    <button type="button" class="btn-secondary" [disabled]="saving || publishing" (click)="save.emit()"><lucide-icon [img]="Save" [size]="16" /> Guardar borrador</button>
    <button type="button" class="btn-primary" [disabled]="saving || publishing || hasValidationErrors" (click)="publish.emit()"><lucide-icon [img]="Upload" [size]="16" /> Publicar</button>
  </div>
</header>

@if (publishedAt) {
  <div class="publish-meta">
    Última publicación: {{ publishedAt | date:'medium' }}
    @if (publishedBy) { · por usuario #{{ publishedBy }} }
  </div>
}
