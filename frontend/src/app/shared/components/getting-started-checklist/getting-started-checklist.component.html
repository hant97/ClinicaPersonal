<div class="card !p-0 bg-white border border-slate-200 shadow-card overflow-hidden" data-testid="getting-started-checklist">
  <div class="flex items-start justify-between gap-3 border-b border-slate-200 px-5 py-4 bg-primary-50/40">
    <div>
      <h2 class="text-sm font-bold text-slate-900">Primeros pasos para empezar a usar el sistema</h2>
      <p class="text-xs text-slate-600 mt-0.5">Completa estos pasos y tu panel operativo se llenará con tu información real.</p>
    </div>
    <button
      type="button"
      class="btn-text !p-1 text-slate-400 hover:text-slate-600 shrink-0"
      title="Ocultar guía de primeros pasos"
      aria-label="Ocultar guía de primeros pasos"
      (click)="dismiss()"
    >
      <lucide-icon [img]="X" [size]="16"></lucide-icon>
    </button>
  </div>

  <ul class="divide-y divide-slate-100">
    @for (step of steps; track step.title) {
      <li>
        <a
          [routerLink]="step.routerLink"
          class="flex items-center gap-3.5 px-5 py-3.5 hover:bg-slate-50 transition"
        >
          <lucide-icon
            [img]="step.done ? CheckCircle2 : Circle"
            [size]="20"
            [ngClass]="step.done ? 'text-emerald-600' : 'text-slate-300'"
            class="shrink-0"
          ></lucide-icon>
          <div class="min-w-0 flex-1">
            <p
              class="text-sm font-semibold truncate"
              [ngClass]="step.done ? 'text-slate-500 line-through' : 'text-slate-900'"
            >
              {{ step.title }}
            </p>
            <p class="text-xs text-slate-500 truncate">{{ step.description }}</p>
          </div>
          <span
            class="shrink-0 rounded-full px-2.5 py-0.5 text-[11px] font-semibold border"
            [ngClass]="step.done ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-slate-200 bg-slate-100 text-slate-600'"
          >
            {{ step.done ? 'Hecho' : 'Pendiente' }}
          </span>
        </a>
      </li>
    }
  </ul>
</div>
