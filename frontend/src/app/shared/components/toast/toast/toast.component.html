<div class="fixed bottom-5 right-5 z-[9999] flex w-full max-w-sm flex-col gap-2" aria-live="polite" aria-atomic="false">
  @for (msg of messages; track msg.id) {
    <div class="flex items-start justify-between gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white shadow-raised" [ngClass]="{'bg-success': msg.type === 'success', 'bg-danger': msg.type === 'error', 'bg-muted': msg.type === 'info'}" [attr.role]="msg.type === 'error' ? 'alert' : 'status'">
      <span class="flex-1">{{ msg.text }}</span>
      <button type="button" class="ml-2 inline-flex shrink-0 items-center justify-center rounded p-1 text-white/80 transition hover:bg-white/15 hover:text-white" aria-label="Cerrar aviso" (click)="dismiss(msg.id)">×</button>
    </div>
  }
</div>
