<div class="icon-picker" role="group" aria-label="Seleccionar icono">
  @for (option of options; track option.code) {
    <button type="button" class="icon-option" [class.selected]="value === option.code" [attr.aria-pressed]="value === option.code" [attr.aria-label]="option.label" [title]="option.label" (click)="select(option.code)">
      <svg [lucideIcon]="option.icon" [size]="20"></svg>
      <span>{{ option.label }}</span>
    </button>
  }
</div>
