spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: backend
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinica_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: SpringBootHikariCP
      max-lifetime: 2000000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Solo activar de forma puntual para incorporar una base existente sin historial de
    # Flyway; activo por defecto podría omitir V1 sobre una base no vacía sin avisar.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  servlet:
    multipart:
      # Debe cubrir el mayor límite aplicado por los servicios de almacenamiento
      # (documentos clínicos: 5 MB); el valor por defecto de Spring es 1 MB.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  # "native" usa el RemoteIpValve de Tomcat: solo acepta X-Forwarded-* desde proxies de
  # confianza (redes privadas y loopback por defecto; ajustable con
  # SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES). "framework" toma el primer valor de
  # X-Forwarded-For, que el cliente puede falsificar.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

auth:
  cookie-secure: ${AUTH_COOKIE_SECURE}
  cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  max-active-refresh-tokens: ${AUTH_MAX_ACTIVE_REFRESH_TOKENS:5}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

clinic:
  calendar:
    google:
      enabled: ${GOOGLE_CALENDAR_ENABLED:false}
      calendar-id: ${GOOGLE_CALENDAR_ID:primary}
      credentials-path: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
      credentials-json: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
      timezone: ${APP_TIMEZONE:America/Lima}
      send-notifications: ${GOOGLE_CALENDAR_SEND_NOTIFICATIONS:false}

storage:
  # local: disco (desarrollo). s3: bucket privado compatible con S3 (AWS S3, Cloudflare R2).
  provider: ${STORAGE_PROVIDER:local}
  local:
    # Usar una ruta absoluta: una relativa depende del directorio desde el que arranca el backend.
    root: ${STORAGE_LOCAL_ROOT:uploads}
  s3:
    bucket: ${STORAGE_S3_BUCKET:}
    # R2: https://<account-id>.r2.cloudflarestorage.com. Vacío para AWS S3.
    endpoint: ${STORAGE_S3_ENDPOINT:}
    # R2: auto. AWS: la región del bucket (por ejemplo, us-east-1).
    region: ${STORAGE_S3_REGION:auto}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}
    path-style: ${STORAGE_S3_PATH_STYLE:true}

appointment:
  reminder-cron: ${APPOINTMENT_REMINDER_CRON:0 30 9 * * *}
  reminder-lead-days: ${APPOINTMENT_REMINDER_LEAD_DAYS:1}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: false

