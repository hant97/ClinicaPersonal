name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinica_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar backend, cobertura y análisis estático
        working-directory: backend
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/clinica_concurrency_test
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgres
        run: bash mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Ejecutar lint Angular y TypeScript
        working-directory: frontend
        run: npm run lint
      - name: Ejecutar pruebas Angular con cobertura
        working-directory: frontend
        run: npm run test:coverage
      - name: Compilar Angular
        working-directory: frontend
        run: npm run build
      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Ejecutar flujos Chromium y pruebas responsive prioritarias
        working-directory: frontend
        run: npm run test:e2e:ci
      - name: Publicar evidencias de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Auditar dependencias de producción
        working-directory: frontend
        run: npm run audit:prod

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@v4
      - name: Instalar OSV-Scanner
        run: |
          curl -sSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Buscar vulnerabilidades conocidas en Maven y npm
        # Incluye dependencias transitivas del backend (pom.xml) y todo el árbol npm.
        run: ./osv-scanner scan source --lockfile=backend/pom.xml --lockfile=frontend/package-lock.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen del backend
        run: docker build --tag clinica-backend:ci backend
