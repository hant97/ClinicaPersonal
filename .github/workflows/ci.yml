name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar backend, cobertura y análisis estático
        working-directory: backend
        run: bash mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Ejecutar lint Angular y TypeScript
        working-directory: frontend
        run: npm run lint
      - name: Ejecutar pruebas Angular con cobertura
        working-directory: frontend
        run: npm run test:coverage
      - name: Compilar Angular
        working-directory: frontend
        run: npm run build
      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Ejecutar flujos Chromium y pruebas responsive prioritarias
        working-directory: frontend
        run: npm run test:e2e:ci
      - name: Publicar evidencias de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Auditar dependencias de producción
        working-directory: frontend
        run: npm run audit:prod
